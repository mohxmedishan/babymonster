<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONSTIEZ // Live News Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#09090b',
                        cardBg: '#121217',
                        accentPink: '#ec4899',
                        accentPurple: '#a855f7',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(18, 18, 23, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow-pink { box-shadow: 0 0 40px -10px rgba(236, 72, 153, 0.25); }
        @keyframes pulse-subtle { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse-subtle { animation: pulse-subtle 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen selection:bg-accentPink selection:text-white pb-16">

    <!-- Top Navigation Bar -->
    <header class="border-b border-zinc-800/80 sticky top-0 z-50 glass">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 rounded-full bg-accentPink animate-ping"></div>
                <span class="mono font-bold tracking-wider text-sm bg-gradient-to-r from-accentPink to-accentPurple bg-clip-text text-transparent">BABYMONSTER.RADAR</span>
            </div>
            <div class="flex items-center space-x-2">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-pink-500/10 text-accentPink border border-pink-500/20">
                    <span class="w-1.5 h-1.5 mr-1.5 bg-accentPink rounded-full"></span> Live Grounding Active
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 pt-8">
        
        <!-- Hero Section -->
        <div class="mb-8 text-center sm:text-left flex flex-col sm:flex-row sm:items-end justify-between gap-4">
            <div>
                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-2">Good Vibes Only 💖</h1>
                <p class="text-zinc-400 text-sm max-w-lg">AI-powered live aggregator tracking positive milestones, comebacks, chart updates, and world tour announcements.</p>
            </div>
            <button onclick="fetchBabyMonsterNews()" id="refreshBtn" class="inline-flex items-center justify-center px-4 py-2.5 rounded-xl font-semibold text-xs tracking-wide bg-gradient-to-r from-accentPink to-accentPurple text-white shadow-lg hover:opacity-90 transition active:scale-95 cursor-pointer">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Scan Updates Now
            </button>
        </div>

        <!-- Status Card / Loader -->
        <div id="statusContainer" class="hidden mb-6 p-4 rounded-xl glass border border-accentPink/20 text-xs mono text-pink-300 flex items-center space-x-3">
            <div class="w-4 h-4 border-2 border-accentPink border-t-transparent rounded-full animate-spin"></div>
            <span id="statusText">Connecting to Gemini Search Grounding node...</span>
        </div>

        <!-- News Feed Grid -->
        <div id="newsFeed" class="space-y-4">
            <!-- Initial Skeleton Placeholder -->
            <div class="p-6 rounded-2xl glass glow-pink animate-pulse-subtle">
                <div class="flex items-center justify-between mb-4">
                    <div class="h-4 bg-zinc-800 rounded w-24"></div>
                    <div class="h-4 bg-zinc-800 rounded w-16"></div>
                </div>
                <div class="h-6 bg-zinc-800 rounded w-3/4 mb-3"></div>
                <div class="h-4 bg-zinc-800 rounded w-full mb-2"></div>
                <div class="h-4 bg-zinc-800 rounded w-5/6"></div>
            </div>
        </div>

    </main>

    <!-- Client-Side Gemini API Script Integration -->
    <script>
        async function fetchBabyMonsterNews() {
            const feed = document.getElementById('newsFeed');
            const statusBox = document.getElementById('statusContainer');
            const statusText = document.getElementById('statusText');
            const refreshBtn = document.getElementById('refreshBtn');

            statusBox.classList.remove('hidden');
            refreshBtn.disabled = true;
            refreshBtn.classList.add('opacity-50');
            statusText.innerText = "Querying live web sources for positive BABYMONSTER updates...";

            try {
                // Calling Gemini API with Google Search tool enabled
                const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=YOUR_API_KEY", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: "Find the absolute latest positive news, music releases, chart achievements, or world tour updates about the K-pop group BABYMONSTER. Filter strictly for good news. Return a clean JSON array of objects with keys: 'title', 'source', 'date', 'summary', and 'url'. Do not include markdown codeblocks formatting like ```json in your response, output just the raw JSON array."
                            }]
                        }],
                        tools: [{ googleSearch: {} }]
                    })
                });

                const data = await response.json();
                statusBox.classList.add('hidden');
                
                let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
                // Cleanup text formatting if markdown ticks slipped through
                rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                const articles = JSON.parse(rawText);

                if (articles.length === 0) {
                    feed.innerHTML = `<div class="p-6 rounded-2xl glass text-center text-zinc-400">No fresh items found right this second. Hit scan again!</div>`;
                } else {
                    feed.innerHTML = articles.map(item => `
                        <article class="p-6 rounded-2xl glass hover:border-accentPink/40 transition group">
                            <div class="flex items-center justify-between text-xs mono text-zinc-400 mb-2">
                                <span class="text-accentPink font-semibold">${item.source || 'Verified Source'}</span>
                                <span>${item.date || 'Recent'}</span>
                            </div>
                            <h2 class="text-xl font-bold mb-2 group-hover:text-pink-300 transition">${item.title}</h2>
                            <p class="text-zinc-300 text-sm leading-relaxed mb-4">${item.summary}</p>
                            ${item.url ? `<a href="${item.url}" target="_blank" class="inline-flex items-center text-xs font-semibold text-accentPink hover:underline">Read full report &rarr;</a>` : ''}
                        </article>
                    `).join('');
                }

            } catch (err) {
                console.error(err);
                statusBox.classList.add('hidden');
                feed.innerHTML = `
                    <div class="p-6 rounded-2xl glass border border-red-500/20 text-center">
                        <p class="text-red-400 font-semibold mb-1">Notice on API Key Setup</p>
                        <p class="text-zinc-400 text-xs">Remember to swap out `YOUR_API_KEY` in the script block with your active Gemini API key to let the live search agent query articles automatically!</p>
                    </div>
                `;
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.classList.remove('opacity-50');
            }
        }

        // Auto-run on load
        window.addEventListener('DOMContentLoaded', () => {
            fetchBabyMonsterNews();
        });
    </script>
</body>
</html>
